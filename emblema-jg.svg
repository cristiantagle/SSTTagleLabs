<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Emblema JG en rombo azul con borde metálico"><defs><!-- Colores (ajusta a tus HEX preferidos) --><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f5f5f5"/><stop offset="50%" stop-color="#bfc4c9"/><stop offset="100%" stop-color="#8a8f94"/></linearGradient><!-- Fondo en dos tonos: corte duro al 50% --><linearGradient id="twoToneBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0f6bdc"/><stop offset="50%" stop-color="#0f6bdc"/><stop offset="50%" stop-color="#114fb1"/><stop offset="100%" stop-color="#114fb1"/></linearGradient><!-- Sombra suave --><filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/></filter></defs>
<!-- Fondo general -->
<rect x="0" y="0" width="300" height="300" fill="none"/>
<!-- Aro superior (argolla) -->
<g filter="url(#softShadow)"><circle cx="150" cy="60" r="16" fill="#ffffff" stroke="url(#metal)" stroke-width="6"/><circle cx="150" cy="60" r="7" fill="none" stroke="#c9ced3" stroke-width="3"/></g>
<!-- Rombo con borde metálico -->
<g filter="url(#softShadow)"><!-- Base del rombo --><rect x="95" y="95" width="110" height="110" rx="22" transform="rotate(45 150 150)" fill="url(#twoToneBlue)" stroke="url(#metal)" stroke-width="10"/><!-- Bisel interior para sensación metálica --><rect x="100" y="100" width="100" height="100" rx="20" transform="rotate(45 150 150)" fill="none" stroke="#e6e9ed" stroke-width="2" opacity="0.8"/></g>
<!-- Letras JG centradas -->
<g font-family="Montserrat, 'Arial Black', sans-serif" font-weight="800" text-anchor="middle"><!-- Contorno sutil para legibilidad sobre el azul --><text x="150" y="170" font-size="70" fill="#ffffff" stroke="#e6e9ed" stroke-width="1.5" paint-order="stroke">JG</text></g></svg>
